[project]
name = "receipt-project"
version = "0.1.0"
description = "Personal receipt ingestion and analytics pipeline"
readme = "README.md"
authors = [
    { name = "thrinaibatchu" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.19.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlglot>=30.17.0",
    "streamlit>=1.62.0",
]

[project.scripts]
receipt-project = "receipt_project:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
