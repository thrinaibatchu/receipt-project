name: OneDrive Receipt Processing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-receipts:
    runs-on: ubuntu-latest

    env:
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
      MICROSOFT_REFRESH_TOKEN: ${{ secrets.MICROSOFT_REFRESH_TOKEN }}

      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      RECEIPT_DB_BACKEND: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: List receipt candidates before processing
        run: uv run --frozen python scripts/list_onedrive_receipts.py

      - name: Verify OneDrive receipt downloads
        run: uv run --frozen python scripts/verify_onedrive_download.py

      - name: Process OneDrive receipt inbox
        run: uv run --frozen python scripts/process_onedrive_inbox.py

      - name: List receipt candidates after processing
        run: uv run --frozen python scripts/list_onedrive_receipts.py
